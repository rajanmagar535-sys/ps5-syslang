name: Build PS5 Syslang

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取你的源码 (Checkout Code)
      uses: actions/checkout@v4

    - name: 2. 安装基础解压工具
      run: |
        sudo apt-get update
        sudo apt-get install -y make unzip

    - name: 3. 智能下载并部署编译好的 SDK
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 利用官方工具直接下载作者打包好的最新发行版 ZIP
        gh release download --repo john-tornblom/ps5-payload-sdk --pattern "*.zip" --dir .
        
        # 解压到一个临时目录
        sudo mkdir -p /opt/ps5-payload-sdk-temp
        ls *.zip | head -n 1 | xargs -I {} sudo unzip -q {} -d /opt/ps5-payload-sdk-temp
        
        # 智能全盘搜索 prospero.mk 的真实嵌套路径
        PROSPERO_PATH=$(find /opt/ps5-payload-sdk-temp -name prospero.mk | head -n 1)
        REAL_SDK_DIR=$(dirname $(dirname "$PROSPERO_PATH"))
        
        # 剥离多余的外层文件夹，直接挪到 Makefile 指定的准确位置
        sudo mv "$REAL_SDK_DIR" /opt/ps5-payload-sdk
        sudo rm -rf /opt/ps5-payload-sdk-temp *.zip

    - name: 4. 开始编译插件 (Compile the Plugin)
      run: |
        export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
        make

    - name: 5. 导出编译成果 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ps5-syslang-build
        path: build/*.elf
