name: Build PS5 Syslang

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取你的源码 (Checkout Code)
      uses: actions/checkout@v4

    - name: 2. 安装编译环境 (Install Compilers)
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make curl unzip vim-common

    - name: 3. 下载并克隆 PS5 Payload SDK (Setup SDK)
      run: |
        sudo rm -rf /opt/ps5-payload-sdk
        sudo git clone https://github.com/john-tornblom/ps5-payload-sdk.git /opt/ps5-payload-sdk

    - name: 4. 开始编译插件 (Compile the Plugin)
      run: |
        export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
        make

    - name: 5. 导出编译成果 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ps5-syslang-build
        path: build/*.elf
