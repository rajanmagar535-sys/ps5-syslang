name: Build PS5 Syslang

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 核心大招：直接调用原作者打包好的完美底层环境
    container: ghcr.io/john-tornblom/ps5-payload-sdk:latest
    
    steps:
    - name: 1. 拉取你的源码 (Checkout Code)
      uses: actions/checkout@v4

    - name: 2. 直接开始编译 (Compile the Plugin)
      run: |
        # 容器内一切环境已就绪，直接运行 make 即可
        export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
        make

    - name: 3. 导出编译成果 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ps5-syslang-build
        path: build/*.elf
